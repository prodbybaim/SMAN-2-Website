<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title if title else "SMAN 2 Cikarang Pusat" }}</title>
  <meta name="description" content="{{ description if description else 'Website resmi SMAN 2 Cikarang Pusat' }}" />
  <meta property="og:title" content="{{ title if title else 'SMAN 2 Cikarang Pusat' }}" />
  <meta property="og:description" content="{{ description if description else 'Website resmi SMAN 2 Cikarang Pusat' }}" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/static/img/favicon.png" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">SMAN 2 Cikarang Pusat</a>

      <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span class="hamburger"></span>
      </button>

      <nav id="mainNav" class="main-nav" aria-label="Main navigation">
        <ul class="nav">
          <li><a href="/" data-path="/">Beranda</a></li>
          <li><a href="/about" data-path="/about">Tentang</a></li>
          <li><a href="/news" data-path="/news">Berita</a></li>
          <li><a href="/gallery" data-path="/gallery">Galeri</a></li>
          <li><a href="/contact" data-path="/contact">Kontak</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ now.year }} Unreleased App, Published for Feedback</p>
      <p>Developed by <a href="https://github.com/hirakamu" target="_blank">Hirakamu</a></p>
    </div>
  </footer>

  <script src="/static/js/scripts.js" defer></script>
</body>
</html>
